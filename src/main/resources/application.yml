spring:
  main:
    web-application-type: none
    banner-mode: off
    keep-alive: true
  ai:
    mcp:
      server:
        name: openstack-mcp-server
        version: 0.0.1
        timeout: 30s

logging:
  level:
    org.springframework.ai: WARN
    ro.dragomiralin: WARN
    root: WARN
  pattern:
    console: ""

openstack:
  authType: ${OPENSTACK_AUTH_TYPE:v3applicationcredential}
  authUrl: ${OPENSTACK_AUTH_URL:http://localhost:5000}
  identityApiVersion: ${OPENSTACK_IDENTITY_API_VERSION:3}
  regionName: ${OPENSTACK_REGION_NAME:RegionOne}
  interface: ${OPENSTACK_INTERFACE:public}
  applicationCredentialId: ${OPENSTACK_APPLICATION_CREDENTIAL_ID:}
  applicationCredentialSecret: ${OPENSTACK_APPLICATION_CREDENTIAL_SECRET:}